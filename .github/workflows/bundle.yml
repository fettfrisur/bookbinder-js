name: Bundle release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run bundle
      - uses: softprops/action-gh-release@v2
        with:
          files: bookbinder.js
